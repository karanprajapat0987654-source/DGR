 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gadh Ganesh Ji ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
background:url("gadh-ganesh.jpg.jpg") no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
animation:bgZoom 15s infinite alternate;
}

@keyframes bgZoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

.box{
background:rgba(0,0,0,0.7);
padding:35px;
border-radius:25px;
text-align:center;
color:white;
max-width:350px;
animation:fadeIn 1.5s ease;
box-shadow:0 0 40px rgba(255,120,180,0.6);
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

h1{
font-size:22px;
margin-bottom:20px;
line-height:1.4;
}

img{
width:230px;
border-radius:20px;
margin-top:15px;
display:none;
animation:pop 1s ease;
box-shadow:0 0 25px pink;
}

@keyframes pop{
from{transform:scale(0);}
to{transform:scale(1);}
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
margin:10px;
transition:0.3s;
}

.yes{
background:#ff9800;
color:white;
box-shadow:0 0 15px orange;
}

.yes:hover{
transform:scale(1.1);
}

#no{
background:#ddd;
position:absolute;
}

.glow{
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 15px pink;}
to{box-shadow:0 0 35px hotpink;}
}
</style>
</head>

<body>

<audio id="song" src="mp3.mp3" preload="auto"></audio>

<div class="box glow">

<h1 id="text">
14 February ko club aur pub to sab jayenge,<br>
kya tum <b>Gadh Ganesh Ji</b> chalogi mere saath? ❤️
</h1>

<img id="photo" src="f.jpg.jpeg">

<br>

<button class="yes" onclick="yesClick()">Yes ❤️</button>
<button id="no" onmouseover="run()">No 😅</button>

</div>

<script>
function yesClick(){
document.getElementById("text").innerHTML="Chalo phir ❤️";
document.getElementById("photo").style.display="block";
document.getElementById("song").play();

if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen();
}
}

function run(){
let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);
let n=document.getElementById("no");
n.style.left=x+"px";
n.style.top=y+"px";
}
</script>

</body>
</html>
